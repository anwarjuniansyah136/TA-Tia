services:

  inventory-core-mysql:
    container_name: inventory-core-mysql
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
    volumes:
      - inventory-core-mysql-data:/var/lib/mysql

volumes:
  inventory-core-mysql-data:
    name: inventory-core-mysql-data
